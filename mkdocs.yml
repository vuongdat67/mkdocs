site_name: Hope Docs
site_url: https://vuongdat67.github.io/mkdocs/
repo_url: https://github.com/vuongdat67/mkdocs
repo_name: vuongdat67/mkdocs
edit_uri: edit/main/docs/
site_author: Vuong Thanh Dat
site_description: Documentation for my project
copyright: Copyright &copy; 2025 Vuong Thanh Dat
theme:
  name: material
  direction: ltr
  language: en
  font:
    text: Inter
    heading: Noto Sans
    subheading: Inter
    meta: Inter
    code: Fira Code
  palette: 
    - scheme: default
      toggle:
        icon: material/brightness-2
        name: Switch to dark mode
      primary: indigo
      accent: deep purple
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
      primary: black
      accent: green
  features:
    # Core navigation
    # - navigation.instant
    # - navigation.instant.prefetch
    # - navigation.instant.progress
    # - navigation.instant.preview
    # - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.path
    - navigation.indexes
    - navigation.top
    - navigation.footer
    # - navigation.expand
    # Content features
    - toc.follow
    # - toc.integrate
    # Search
    - search.suggest
    - search.highlight
    - search.share
    # Content
    - content.code.copy
    - content.code.select
    - content.code.annotate
    - content.tabs.link
    - content.action.view
    - content.action.edit
    - content.attachment
    # Tooltips
    - content.tooltips
    - content.footnote.tooltips
    # Announcements
    # - announce.dismiss
    # - header.autohide
plugins:
  - search:
      lang: [en, vi] #, vi
      separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'
      pipeline:
        - stemmer
        - stopWordFilter
        - trimmer
  - blog:
      blog_dir: blog
      blog_toc: true
      post_date_format: full
      post_url_date_format: yyyy/MM/dd
      post_url_format: "{date}/{slug}"
      archive_date_format: yyyy
      archive_url_date_format: yyyy
      authors_file: "blog/.authors.yml"
      categories_name: "Categories"
      archive_name: "Archive"
  - tags:
      tags_slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
      tags_slugify_format: "tag:{slug}"
  # - minify:
  #     minify_html: true
  #     minify_css: true
  #     minify_js: true
  #     htmlmin_opts:
  #       remove_comments: true
  # - macros
  - glightbox
  - obsidian-interactive-graph
  - ezlinks
  - gen-files:
      scripts:
        - scripts/gen_pages.py
  - literate-nav
  # - obsidian-support

  # - git-revision-date-localized
  # - kroki:
  #     ServerURL: https://kroki.io
  #     EnableBlockDiag: true
  #     EnableMermaid: true


markdown_extensions:
  # ── Essential extensions ───────────────────────────────
  - footnotes
  - def_list
  - abbr
  - attr_list
  - md_in_html
  - tables
  - pymdownx.blocks.caption
  - admonition          # Callouts (map từ Obsidian)
  - pymdownx.details    # Collapsible sections (Obs collapsible)
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

  # ── Code highlighting ──────────────────────────────────
  - pymdownx.highlight:
      # linenums: true          # Hiển thị số dòng mặc định
      anchor_linenums: true   # Cho phép link tới từng dòng
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:     # Hỗ trợ code block nâng cao
      custom_fences:
        - name: mermaid       # Vẽ biểu đồ Mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  # - pymdownx.snippets:        # Import file/snippet chung
  #     auto_append:
  #       - includes/mkdocs.md

  # ── Text formatting ────────────────────────────────────
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret        # ^caret^
  - pymdownx.mark         # ==highlight==
  - pymdownx.tilde        # ~~strike~~
  - pymdownx.keys         # ++ctrl+c++
  - pymdownx.smartsymbols # (c) -> ©, -- -> –, -> -> →

  # ── Lists and tasks ────────────────────────────────────
  - pymdownx.tasklist:
      custom_checkbox: true   # Todo list giống Obsidian
  - sane_lists

  # ── Tabs ───────────────────────────────────────────────
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

  # ── Math and links ─────────────────────────────────────
  - pymdownx.arithmatex:
      generic: true           # MathJax/KaTeX
  - pymdownx.magiclink:       # Tự nhận link, issue, PR
      normalize_issue_symbols: true
      repo_url_shorthand: true

  # ── Emojis ─────────────────────────────────────────────
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

  # ── Misc ───────────────────────────────────────────────
  - nl2br                 # Xuống dòng tự động khi gặp \n


extra:
  social:
    - icon: simple/youtube
      link: https://youtube.com/@yourchannel
    - icon: fontawesome/brands/github-alt
      link: https://github.com/vuongdat67
    - icon: fontawesome/brands/linkedin
      link: https://linkedin.com/in/yourprofile
  generator: false
    # Add security headers
  analytics:
    feedback:
      title: Was this page helpful?
      ratings:
        - icon: material/emoticon-happy-outline
          name: This page was helpful
          data: 1
          note: Thanks for your feedback!
        - icon: material/emoticon-sad-outline
          name: This page could be improved
          data: 0
          note: Thanks for your feedback!

extra_css:
  - assets/stylesheets/heading.css
  - assets/stylesheets/customize.css
  # - assets/stylesheets/horizen.css
  # - assets/stylesheets/catppuccin.css
  # - assets/stylesheets/theme.css
  - assets/stylesheets/obsidian_tags.css
  - assets/stylesheets/interactive_graph.css

extra_javascript:
  - https://fastly.jsdelivr.net/npm/jquery/dist/jquery.min.js
  - https://fastly.jsdelivr.net/npm/echarts/dist/echarts.min.js
  - assets/javascripts/obsidian_tags.js
  - assets/javascripts/interactive_graph.js


validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn

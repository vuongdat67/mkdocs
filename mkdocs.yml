  - assets/javascripts/katex.js
  # - https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js
  # - https://cdn.jsdelivr.net/npm/mermaid-plugin-zoom@1.0.0/dist/mermaid-plugin-zoom.min.js
  #   - https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js
  # - https://cdn.jsdelivr.net/npm/mermaid-plugin-zoom@1.0.0/dist/mermaid-plugin-zoom.min.js
  # - assets/javascripts/mermaid-zoom-init.js
  
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
    

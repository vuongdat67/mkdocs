site_name: Hope Docs
site_url: https://vuongdat67.github.io/mkdocs/
repo_url: https://github.com/vuongdat67/mkdocs
repo_name: vuongdat67/mkdocs
edit_uri: edit/main/docs/
site_author: Vuong Thanh Dat
site_description: Documentation for my project
copyright: Copyright &copy; 2025 Vuong Thanh Dat
theme:
  name: material
  direction: ltr
  language: en
  font:
    text: Inter
    code: Fira Code
  palette: 
    - scheme: default
      toggle:
        icon: material/brightness-2
        name: Switch to dark mode
      primary: indigo
      accent: deep purple
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
      primary: black
      accent: green
  features:
    # Core navigation
    # - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.instant.preview
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.path
    - navigation.indexes
    - navigation.top
    - navigation.footer
    # - navigation.expand
    # Content features
    - toc.follow
    # - toc.integrate
    # Search
    - search.suggest
    # - search.highlight
    - search.share
    # Content
    - content.code.copy
    - content.code.select
    - content.code.annotate
    - content.tabs.link
    - content.action.view
    - content.action.edit
    - content.attachment
    # Tooltips
    - content.tooltips
    - content.footnote.tooltips
    # Announcements
    # - announce.dismiss
    # - header.autohide

plugins:
  - search:
      lang: [en, vi] 
      separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'
      pipeline:
        - stemmer
        - stopWordFilter
        - trimmer
  - callouts
  # - mermaid2
  - markdown-exec
  - panzoom  # Chưa cài plugin này
  - mkdocs_quiz
  - blog:
      blog_dir: blog
      blog_toc: true
      post_date_format: full
      post_url_date_format: yyyy/MM/dd
      post_url_format: "{date}/{slug}"
      archive_date_format: yyyy
      archive_url_date_format: yyyy
      authors_file: "blog/.authors.yml"
      categories_name: "Categories"
      archive_name: "Archive"
  - tags:
      tags_slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
      tags_slugify_format: "tag:{slug}"
  - minify:
      minify_html: true
      minify_css: true
      minify_js: true
      htmlmin_opts:
        remove_comments: true
      cache_safe: true
  # - macros
  - glightbox:  # Image lightbox
      touchNavigation: true
      loop: false
      effect: zoom
      slide_effect: slide
      width: 100%
      height: auto
      zoomable: true
      draggable: true
      auto_caption: false
      caption_position: bottom
      # touchNavigation: true
      # loop: true
      # height: auto
      # width: 80%

  # - obsidian-interactive-graph
  - ezlinks

  # - git-revision-date-localized:
  #     enable_creation_date: true
  #     type: timeago
  #     timezone: Asia/Ho_Chi_Minh
  #     locale: vi
  #     fallback_to_build_date: true
  # - kroki:
  #     ServerURL: https://kroki.io
  #     EnableBlockDiag: true
  #     EnableMermaid: true


markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - sane_lists
  - nl2br
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
      auto_title: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.blocks.tab
  - pymdownx.blocks.caption
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.keys
  - pymdownx.smartsymbols
  - pymdownx.magiclink:
      normalize_issue_symbols: true
      repo_url_shorthand: true
  - pymdownx.critic
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
           

extra:
  social:
    - icon: simple/youtube
      link: https://youtube.com/@yourchannel
    - icon: fontawesome/brands/github-alt
      link: https://github.com/vuongdat67
    - icon: fontawesome/brands/linkedin
      link: https://linkedin.com/in/yourprofile
  generator: false
  analytics:
    feedback:
      title: Was this page helpful?
      ratings:
        - icon: material/emoticon-happy-outline
          name: This page was helpful
          data: 1
          note: Thanks for your feedback!
        - icon: material/emoticon-sad-outline
          name: This page could be improved
          data: 0
          note: Thanks for your feedback!

extra_css:
  # - assets/stylesheets/heading.css
  # - assets/stylesheets/background.css
  - assets/stylesheets/admonition.css
  - assets/stylesheets/table.css
  - assets/stylesheets/navlink.css
  # - assets/stylesheets/obsidian_tags.css
  # - assets/stylesheets/interactive_graph.css
  - https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.1.0/style.css
